{% extends "base.html" %}
{% block title %}Reset Password | Alumni Job Portal{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-4 col-md-6">
            <div class="card shadow-lg p-4 rounded">
                <h3 class="text-center mb-4">Reset Password</h3>

                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} small">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    <div class="form-group">
                        <label class="small font-weight-bold">Enter your registered email</label>
                        <input type="email" name="email" class="form-control" required placeholder="Email">
                    </div>

                    <button type="submit" class="btn btn-primary btn-block mt-3">
                        Send Temporary Password
                    </button>
                </form>

                <div class="mt-3 text-center">
                    <a href="{% url 'login' %}" class="small text-muted">Back to login</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
